services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timesfm-backend
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - TIMESFM_API_KEY=${TIMESFM_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: timesfm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
